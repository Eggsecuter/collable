services:
  collable:
    build:
      context: .
      dockerfile: dockerfile
    image: collable
    container_name: collable
    restart: unless-stopped
    ports:
      - "7060:7060"
    env_file:
      - ${COLLABLE_ENV:-../environment/collable/collable.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
